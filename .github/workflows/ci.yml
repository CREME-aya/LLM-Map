name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Rust, Host Smoke, make verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rust

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rust format, clippy, and workspace tests
        run: |
          cd core-rust && cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test --workspace

      - name: Host C ABI & JNI smoke tests
        run: |
          cc --version
          javac -version
          java -version
          bash core-rust/scripts/host-smoke.sh

      - name: Run repository verification (make verify)
        run: make verify
